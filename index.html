<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spell-Spiff — Rune Recognition Harness</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>Spell-Spiff — Rune Recognition Harness</h1>
      <div id="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="hud">
          <span id="fps">FPS: --</span>
          <span id="infer">Infer: -- ms</span>
          <span id="pinch-ratio">Pinch: --</span>
          <span id="point-count">Points: 0</span>
        </div>
        <div id="pen-indicator" class="pen-up">PEN UP</div>
      </div>
      <div id="controls">
        <label>
          Pinch threshold
          <input id="pinch-threshold" type="range" min="0.05" max="0.8" step="0.01" value="0.35" />
          <span id="pinch-threshold-value">0.35</span>
        </label>
      </div>
      <p id="status">Starting camera…</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
